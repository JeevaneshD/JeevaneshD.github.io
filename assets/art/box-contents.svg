<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="box-title box-desc">
  <title id="box-title">Inside the Echo box</title>
  <desc id="box-desc">Line drawings of Echo, its travel case, USB-C cable and documentation arranged around an open box.</desc>
  <defs>
    <linearGradient id="box-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#302047"/>
      <stop offset="1" stop-color="#151019"/>
    </linearGradient>
    <radialGradient id="box-cup" cx="35%" cy="25%" r="82%">
      <stop offset="0" stop-color="#d9c8ff"/>
      <stop offset="0.3" stop-color="#9b7dd6"/>
      <stop offset="0.72" stop-color="#594080"/>
      <stop offset="1" stop-color="#2a173f"/>
    </radialGradient>
    <linearGradient id="box-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#675faa"/>
      <stop offset="1" stop-color="#d7df23"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" rx="40" fill="url(#box-bg)"/>
  <g fill="none" stroke="#f3f0fb" stroke-opacity="0.08">
    <circle cx="600" cy="400" r="330"/>
    <circle cx="600" cy="400" r="250" stroke-dasharray="2 10"/>
    <path d="M90 690h1020M90 110h1020"/>
  </g>

  <!-- Box base -->
  <g>
    <path d="M430 372 600 450 770 372 600 294Z" fill="#21162e" stroke="#675faa" stroke-opacity="0.7"/>
    <path d="M430 372v118l170 78V450Z" fill="#1b1226" stroke="#675faa" stroke-opacity="0.45"/>
    <path d="M770 372v118l-170 78V450Z" fill="#251932" stroke="#675faa" stroke-opacity="0.45"/>
    <path d="M430 372 600 450 770 372" fill="none" stroke="#f3f0fb" stroke-opacity="0.22"/>
  </g>

  <!-- Echo sphere -->
  <g transform="translate(255 210)">
    <circle cx="90" cy="90" r="72" fill="url(#box-cup)" stroke="#1a1027" stroke-width="2"/>
    <path d="M90 18v144" stroke="#f3f0fb" stroke-opacity="0.4"/>
    <path d="M40 45c30-22 70-22 100 0" fill="none" stroke="#f3f0fb" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="90" cy="90" r="58" fill="none" stroke="#f3f0fb" stroke-opacity="0.1"/>
  </g>

  <!-- Case -->
  <g transform="translate(745 198)">
    <rect x="0" y="18" width="190" height="128" rx="38" fill="#1b1226" stroke="#675faa" stroke-opacity="0.8" stroke-width="2"/>
    <path d="M28 50h134" stroke="#f3f0fb" stroke-opacity="0.28"/>
    <path d="M54 18c0-12 10-18 22-18h38c12 0 22 6 22 18" fill="none" stroke="#675faa" stroke-opacity="0.8" stroke-width="2"/>
    <circle cx="95" cy="50" r="5" fill="#d7df23"/>
  </g>

  <!-- Cable -->
  <g transform="translate(214 566)" fill="none" stroke-linecap="round">
    <path d="M0 0c30 34 44 62 86 62 36 0 45-30 78-30 24 0 36 14 48 30" stroke="url(#box-line)" stroke-width="3"/>
    <rect x="-18" y="-10" width="30" height="20" rx="6" fill="#1b1226" stroke="#675faa" stroke-width="2"/>
    <rect x="204" y="52" width="30" height="20" rx="6" fill="#1b1226" stroke="#675faa" stroke-width="2"/>
    <circle cx="212" cy="62" r="2" fill="#d7df23" stroke="none"/>
  </g>

  <!-- Documentation -->
  <g transform="translate(734 556)">
    <rect x="0" y="0" width="120" height="154" rx="10" fill="#1b1226" stroke="#675faa" stroke-opacity="0.8" stroke-width="2"/>
    <path d="M22 34h76M22 58h76M22 82h54M22 106h64" stroke="#f3f0fb" stroke-opacity="0.28" stroke-width="2"/>
    <path d="M22 130h38" stroke="#d7df23" stroke-opacity="0.8" stroke-width="2"/>
  </g>

  <!-- Connector ticks -->
  <g stroke="#f3f0fb" stroke-opacity="0.16">
    <path d="M365 330 470 356M830 330 748 356M338 540 470 472M760 540 730 472"/>
  </g>
</svg>
