<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-labelledby="war-title war-desc">
  <title id="war-title">Warranty</title>
  <desc id="war-desc">A shield outline containing the Echo sphere and a two-year mark.</desc>
  <defs>
    <linearGradient id="war-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#342152"/>
      <stop offset="1" stop-color="#141017"/>
    </linearGradient>
    <radialGradient id="war-cup" cx="35%" cy="25%" r="80%">
      <stop offset="0" stop-color="#d9c8ff"/>
      <stop offset="0.4" stop-color="#9274cc"/>
      <stop offset="1" stop-color="#3a2457"/>
    </radialGradient>
  </defs>
  <rect width="900" height="700" rx="36" fill="url(#war-bg)"/>
  <g fill="none" stroke="#f3f0fb" stroke-opacity="0.08">
    <circle cx="450" cy="350" r="290"/>
    <circle cx="450" cy="350" r="230" stroke-dasharray="2 10"/>
  </g>

  <!-- Shield -->
  <path d="M450 108 676 190v178c0 118-94 192-226 238-132-46-226-120-226-238V190Z" fill="#1b1226" stroke="#675faa" stroke-opacity="0.85" stroke-width="3"/>
  <path d="M450 146 640 214v150c0 96-76 158-190 200-114-42-190-104-190-200V214Z" fill="none" stroke="#f3f0fb" stroke-opacity="0.1"/>

  <!-- Sphere -->
  <g transform="translate(450 338)">
    <circle cx="0" cy="0" r="82" fill="url(#war-cup)" stroke="#1a1027" stroke-width="2"/>
    <path d="M0-82V82" stroke="#f3f0fb" stroke-opacity="0.4"/>
    <path d="M-56-34c34-26 78-26 112 0" fill="none" stroke="#f3f0fb" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M0 74v22" stroke="#d7df23" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Two year mark -->
  <g transform="translate(450 520)" fill="none" stroke="#d7df23">
    <path d="M-56 0h112" stroke-opacity="0.4"/>
    <path d="M-56-7v14M56-7v14" stroke-opacity="0.4"/>
    <text x="0" y="30" text-anchor="middle" fill="#f3f0fb" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="6" stroke="none">02 YEARS</text>
  </g>
</svg>
